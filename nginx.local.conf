user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-js text/x-component text/x-cross-domain-policy;

    # Upstream backends
    upstream backend {
        server backend:8000;
    }

    upstream api_tgr {
        server tgr-api:8000;
    }

    upstream api_aach {
        server aach-api:8000;
    }

    upstream api_carabineros {
        server carabineros-api:8000;
    }

    upstream api_mtt {
        server mtt-api:8000;
    }

    upstream api_prt {
        server prt-api:8000;
    }

    upstream api_sgd {
        server sgd-api:8000;
    }

    upstream api_sii {
        server sii-api:8000;
    }

    upstream api_srcei {
        server srcei-api:8000;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # ===================================
        # Backend Central
        # ===================================

        location ^~ /back/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect ~^http://backend http://$host:$server_port/back;
        }

        location = /back {
            return 301 $scheme://$host:$server_port/back/;
        }

        # ===================================
        # APIs Individuales
        # ===================================

        location ^~ /tgr/ {
            proxy_pass http://api_tgr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_tgr http://$host:$server_port/tgr;
        }

        location = /tgr {
            return 301 $scheme://$host:$server_port/tgr/;
        }

        location ^~ /aach/ {
            proxy_pass http://api_aach/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_aach http://$host:$server_port/aach;
        }

        location = /aach {
            return 301 $scheme://$host:$server_port/aach/;
        }

        location ^~ /carabineros/ {
            proxy_pass http://api_carabineros/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_carabineros http://$host:$server_port/carabineros;
        }

        location = /carabineros {
            return 301 $scheme://$host:$server_port/carabineros/;
        }

        location ^~ /mtt/ {
            proxy_pass http://api_mtt/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_mtt http://$host:$server_port/mtt;
        }

        location = /mtt {
            return 301 $scheme://$host:$server_port/mtt/;
        }

        location ^~ /prt/ {
            proxy_pass http://api_prt/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_prt http://$host:$server_port/prt;
        }

        location = /prt {
            return 301 $scheme://$host:$server_port/prt/;
        }

        location ^~ /sgd/ {
            proxy_pass http://api_sgd/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_sgd http://$host:$server_port/sgd;
        }

        location = /sgd {
            return 301 $scheme://$host:$server_port/sgd/;
        }

        location ^~ /sii/ {
            proxy_pass http://api_sii/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_sii http://$host:$server_port/sii;
        }

        location = /sii {
            return 301 $scheme://$host:$server_port/sii/;
        }

        location ^~ /srcei/ {
            proxy_pass http://api_srcei/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect ~^http://api_srcei http://$host:$server_port/srcei;
        }

        location = /srcei {
            return 301 $scheme://$host:$server_port/srcei/;
        }

        # Health check endpoints
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
